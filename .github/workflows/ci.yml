name: CI

# Runs on every pull request, and on main after a merge. Main is checked
# separately rather than trusted: PR checks run against the merge candidate,
# and two PRs that each pass alone can still break main together.
#
# `pull_request`, NEVER `pull_request_target`. The difference is the whole of
# this workflow's security posture now that anyone can fork:
#
#   - `pull_request` runs the contributor's code with a read-only GITHUB_TOKEN
#     and NO access to repository secrets. A fork can change a build script, a
#     test, or a dependency hook, and still reach nothing.
#   - `pull_request_target` would run in the BASE repository's context, with
#     secrets available. Combined with checking out the fork's code — which is
#     what people reach for when they want secrets in a fork PR — it hands the
#     contributor those secrets. GitHub's own guidance is to inspect
#     pull-request code as data under that trigger and never execute it.
#
# This workflow needs no secrets, so the safe trigger costs nothing. If a job
# here ever DOES need one, the answer is a separate workflow gated on a
# maintainer action, not a trigger change.
on:
  push:
    branches: [main]
  pull_request:
  # So a maintainer can re-run the gate against a branch without pushing an
  # empty commit, which is the usual workaround and pollutes the history.
  workflow_dispatch:

# A new push supersedes the run in flight. Cheap insurance against a busy
# pull request queueing three runs deep, and it keeps the feedback a
# contributor sees pinned to their latest push rather than an earlier one.
#
# (This was written when the repo was private and macOS minutes billed at 10x.
# Public repositories get Actions free, including the macOS runners — which is
# why this workflow can now actually run at all. Every run before the repo went
# public failed in about six seconds with no steps executed, because the
# spending limit blocked it.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only, at the top level, so every job inherits it and a new job cannot
# quietly acquire write access by omission. Nothing here publishes anything.
permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    # Ubuntu on purpose: none of these need Swift or macOS, and it starts in
    # seconds where a macOS runner takes a minute. A contributor who has broken
    # a whitespace rule learns it almost immediately instead of after the build.
    # Everything requiring a compiler is below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No build artifacts committed
        run: |
          tracked=$(git ls-files | grep -E '^(\.build|build)/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::build output is tracked in git:"; echo "$tracked"; exit 1
          fi

      - name: No merge conflict markers
        run: |
          # Anchored to line start with a trailing space, so ordinary prose
          # about diffs and the spec's own tables do not trip it.
          hits=$(git ls-files '*.swift' '*.md' '*.sh' '*.yml' \
                 | xargs grep -lE '^(<<<<<<<|>>>>>>>) ' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::merge markers in:"; echo "$hits"; exit 1
          fi

      - name: No trailing whitespace
        run: |
          hits=$(git ls-files '*.swift' '*.sh' '*.yml' | xargs grep -lE ' +$' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::trailing whitespace in:"; echo "$hits"; exit 1
          fi

      - name: No tabs in Swift sources
        run: |
          # `printf` rather than grep -P: -P is GNU-only, and a check that
          # cannot be run on a maintainer's Mac is one nobody verifies.
          hits=$(git ls-files '*.swift' | xargs grep -l "$(printf '\t')" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::tab characters in:"; echo "$hits"; exit 1
          fi

      - name: Scripts are executable and parse
        run: |
          for script in $(git ls-files 'Scripts/*.sh' 'Scripts/**/*.sh'); do
            # A script committed without +x fails only when someone runs it,
            # which for a release script means at release time.
            [ -x "$script" ] || { echo "::error file=$script::not executable"; exit 1; }
            bash -n "$script" || { echo "::error file=$script::syntax error"; exit 1; }
          done

  build-and-test:
    name: Build and test
    # macos-26 matches Package.swift's `.macOS(.v26)` floor deliberately.
    # Building on the floor is what catches an API newer than the floor being
    # used by accident; a newer runner would compile it happily and ship
    # something that traps on a supported machine. This job earned that keep
    # before it ever went green: pinned to the previous floor, its first run
    # proved the package no longer compiled at the floor it then declared.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # Keyed on the manifest so a dependency change busts it, and restored
      # loosely so an unrelated change still gets a warm start.
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (warnings are errors)
        # Sources only, and source warnings are the ones that ship.
        #
        # The test targets carry 22, counted 2026-09-17 from a forced rebuild
        # — an incremental build reports none, which is how a stale count
        # survives in a comment. Sixteen are main-actor isolation in
        # SettingsWindowLayoutTests, GainMeterTests, TrackColourTests,
        # TimelineViewTests and VoiceoverFeedbackTests; six are in
        # ShareMenuTests and CANNOT be fixed by annotation —
        # `ShareMenu.services()` carries a deliberate
        # `@available(macOS, deprecated: 13.0)`, Swift propagates that to every
        # caller, and swift-testing refuses `@Suite` on a deprecated type. So
        # gating the tests means either exempting a warning group for the whole
        # package or deleting a documented decision; it is a separate change
        # and may not be a possible one.
        #
        # This comment previously named 30 redundant-`try` warnings on
        # `EditorWindowTestGate.run` in DocumentOpenerTests and DockReopenTests.
        # Those are gone, and the file it named no longer exists.
        #
        # No warning group is exempt. Raising the floor to macOS 26 (D77) made
        # 18 deprecations fire in CompositionBuilder.swift; they were migrated
        # to AVVideoComposition.Configuration rather than exempted, so this can
        # stay absolute.
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        # NOT the whole suite, and the exclusion is load-bearing rather than
        # tidy. SnittExportTests and SnittAppTests HANG on a GitHub-hosted
        # runner: the first full run got 670 tests in, then stalled for 37
        # minutes until the job timeout killed it. The 254 that never returned
        # are exactly the ones that build an AVFoundation composition, encode a
        # movie, or open a window — work a headless runner with no hardware
        # video encoder cannot finish.
        #
        # So this gates the five targets that DO run: the document model, the
        # capture layer, the automation protocol, the CLI and the MCP bridge.
        # 475 tests in about ten seconds.
        #
        # What that leaves uncovered is worth naming rather than forgetting:
        # export, composition, the editor and the timeline are verified
        # LOCALLY ONLY. `swift test` with no filter is still the gate before a
        # release, and docs/DEVELOPING.md says so.
        run: |
          set -o pipefail
          swift test --filter 'SnittDocumentTests|SnittCaptureTests|SnittAutomationTests|SnittCLITests|SnittMCPTests' \
            2>&1 | tee test-output.txt || true
          # `swift test` EXITS 0 WHEN THE TEST BUNDLE SEGFAULTS, printing an
          # inline "signal code 11" and no summary line at all. This project
          # has hit that twice, most recently after adding a stored property to
          # a public struct. So the exit status is not the signal — the summary
          # line is, and its absence is a failure however the process exited.
          if grep -qE '^.*signal code' test-output.txt; then
            echo "::error::the test bundle crashed (signal), which swift test reports as success"
            exit 1
          fi
          if ! grep -qE 'Test run with [0-9]+ tests.*passed' test-output.txt; then
            echo "::error::no passing summary line — treat this as a failure regardless of exit status"
            tail -40 test-output.txt
            exit 1
          fi
          grep -E 'Test run with [0-9]+ tests' test-output.txt | tail -1

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: ignore

  release-build:
    name: Release build
    # Main only. A release build catches what only the optimiser sees, and
    # costs a second macOS job: worth paying once per merge rather than on
    # every push to every branch, including every push to every fork.
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build release
        run: swift build --configuration release -Xswiftc -warnings-as-errors
